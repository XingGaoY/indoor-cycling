[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "indoor-cycling"
version = "0.1.0"
description = "Local-first Mac mini indoor cycling controller (simulator MVP)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "bleak>=0.22,<3"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
indoor-cycling = "indoor_cycling.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/indoor_cycling"]
[tool.pytest.ini_options]
pythonpath = ["src"]
